# Les mêmes règles que Bizet, moins celles qui ne concernent que Flutter :
# `lints/recommended.yaml` est le socle sur lequel `flutter_lints` est bâti.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lints/recommended.yaml

linter:
  rules:
